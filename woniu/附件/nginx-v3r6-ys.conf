
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$scheme     $remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  v3r6-logs/access.log  main;
    error_log   v3r6-logs/error.log error;
    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;
    #server {
        


    #}


    server {
client_max_body_size 500M;    
     listen       9862;
proxy_connect_timeout 300;  # 5 minutes
        proxy_send_timeout 300;     # 5 minutes
        proxy_read_timeout 300;     # 5 minutes

         #ssl证书的pem文件路径
        #ssl_certificate /usr/local/nginx/conf/zwpt.qgrd.npc.pem;
         #              #ssl证书的key文件路径
        #ssl_certificate_key /usr/local/nginx/conf/zwpt.qgrd.npc.key;
        server_name  localhost;
        location ^~ /dmp-visual  {
            proxy_pass http://127.0.0.1:8888;
        }
        location /fs/ {
    alias /data/;  # 直接映射，不拼接 /fs
    expires 7d;     # 可选：静态资源缓存
    default_type application/javascript;  # 确保JS正确MIME类型
}
       location /  {
                root /data/npcs-web;
                #index index.html;
                try_files $uri $uri/ /index.html =404;
         }
        location ^~ /bi {
                proxy_pass http://127.0.0.1:8888;
                proxy_set_header Host 127.0.0.1:8888;
                #proxy_set_header X-Real-IP ;
                #proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                #proxy_set_header  Referer $http_referer;
                proxy_set_header Cookie $http_cookie;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';

        }
        

location ~ ^/rbi {
    proxy_pass http://10.16.23.189:8001;
    proxy_set_header Host 10.16.23.189:8001;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
}


                location ^~ /workflow  {
            proxy_pass http://127.0.0.1:8888;
                         proxy_set_header Host 127.0.0.1:8888;
                #proxy_set_header X-Real-IP ;
                #proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                #proxy_set_header  Referer $http_referer;
                proxy_set_header Cookie $http_cookie;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
        }
           location ^~ /diserver  {
            proxy_pass http://127.0.0.1:8888;
                         proxy_set_header Host 127.0.0.1:8888;
                #proxy_set_header X-Real-IP ;
                #proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                #proxy_set_header  Referer $http_referer;
                proxy_set_header Cookie $http_cookie;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
        }
 location ^~ /ssfda  {
            proxy_pass http://127.0.0.1:8888;
                        add_header 'Access-Control-Allow-Origin' '*';
                        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
                        add_header 'Access-Control-Allow-Headers' 'Jsessionid, Authorization, Content-Type, Cookie, Referer'; 

                proxy_set_header Jsessionid $http_jsessionid;
                        proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP 127.0.0.1:8888;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
                        proxy_set_header  Referer $http_referer;
                        proxy_set_header Cookie $http_cookie;
                        proxy_set_header Upgrade $http_upgrade;
                        proxy_set_header Connection 'upgrade';

                proxy_set_header Cookie $http_cookie;
    }
        location ^~ /api/ {
                proxy_pass http://127.0.0.1:8888/;
                proxy_set_header Jsessionid $http_jsessionid;
                
                proxy_set_header Host $http_host;
                #proxy_set_header X-Real-IP 10.16.23.174:7001;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto 'https';
                proxy_set_header  Referer $http_referer;
                proxy_set_header Cookie $http_cookie;
                #proxy_cookie_path / "/: secure;HttpOnly";
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                      # SSE支持 - 必须                                                                                                                                                          
                proxy_buffering off;              # 关闭缓冲，立即推送                                                                                                                    
                proxy_cache off;                  # 关闭缓存                                                                                                                              
                 proxy_read_timeout 3600s;         # SSE长连接超时时间                                                                                                                     
                  proxy_set_header Connection '';   # 覆盖 Connection: upgrade，SSE不需要升级协议                                                                                           
                  chunked_transfer_encoding on;    
        }   
            location ^~ /dmp-allin  {
            proxy_pass http://127.0.0.1:8888;
                        proxy_set_header  Referer http://127.0.0.1:8888;
                        proxy_set_header Jsessionid $http_jsessionid;
                          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                         proxy_set_header X-Forwarded-Proto 'https';
                         proxy_set_header  Referer $http_referer;
                         proxy_set_header Cookie $http_cookie;
                         proxy_set_header Upgrade $http_upgrade;
                         proxy_set_header Connection 'upgrade';
        
                proxy_set_header Cookie $http_cookie;
        }
                location ^~ /dmp-allin/aiStudio/ {
                        proxy_pass http://10.16.22.100:3000;
                        proxy_set_header Jsessionid $http_jsessionid;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-Host $proxy_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            add_header backendIP $upstream_addr;
            add_header backendCode $upstream_status;
       }

      location ^~ /dmp-tag/ {
                        proxy_pass http://127.0.0.1:8888;
                        add_header 'Access-Control-Allow-Origin' '*';
                        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
                        add_header 'Access-Control-Allow-Headers' 'Jsessionid, Authorization, Content-Type, Cookie, Referer'; 

                proxy_set_header Jsessionid $http_jsessionid;
                        proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP 127.0.0.1:8888;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
                        proxy_set_header  Referer $http_referer;
                        proxy_set_header Cookie $http_cookie;
                        proxy_set_header Upgrade $http_upgrade;
                        proxy_set_header Connection 'upgrade';
        }

 
    }
