
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;
    client_max_body_size 50m;
    fastcgi_buffers 8 128k;
    send_timeout 60;
	
    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    server {
        listen       5002;
        server_name  localhost;
		
		proxy_connect_timeout 60s;
	    proxy_send_timeout 60s;
	    proxy_read_timeout 60s;
		
		proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-Server $proxy_add_x_forwarded_for;

        proxy_set_header Cookie $http_cookie;

        #charset koi8-r;

        access_log  logs/host.access.log  main;

       	client_max_body_size 100M;
	location ^~ /dmp-visual  {
            proxy_pass http://10.16.23.199:8082;
        }
	location ^~ /dmp-allin  {
            proxy_pass http://10.16.23.199:8082;
            proxy_set_header jsessionid $http_jsessionid;        
            proxy_set_header Referer $http_referer;
	    proxy_set_header X-real-IP 10.16.23.192:8888;
            proxy_set_header Host $http_host;
}
	
	location ^~ /bi {
		proxy_pass http://10.16.23.199:8082;
                proxy_set_header Host 10.16.23.199:8082;
                #proxy_set_header X-Real-IP ;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                #proxy_set_header  Referer $http_referer;
                proxy_set_header Cookie $http_cookie;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
        } 
	location /  {
               root /data/build/;
               #index index.html;
               try_files $uri $uri/ /index.html =404;
        }
        location ^~ /api/ {
               proxy_pass http://10.16.23.199:8082/;
               proxy_set_header Jsessionid $http_jsessionid;
               proxy_set_header Host $http_host;
               proxy_set_header X-Real-IP 10.16.23.192:8888;
               proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
               proxy_set_header X-Forwarded-Proto $scheme;
               proxy_set_header  Referer $http_referer;
               proxy_set_header Cookie $http_cookie;
               proxy_set_header Upgrade $http_upgrade;
               proxy_set_header Connection 'upgrade';
        }

    }




}
