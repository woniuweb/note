#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    server {
         listen       8886;
        server_name  localhost;
        location /npcsapp-fe {

            alias /usr/local/nginxV3R6/nginx/html/dist/;
           # index  index.html index.htm;
           try_files $uri $uri/ /index.html = 404;
        }
location /npcsapp-manager {
            
           alias /usr/local/nginxV3R6/nginx/html/build-app/;
            index index.html index.htm; # 默认⾸⻚
            
        }
location /api/npcsapp/ai-adapter-robot-mobile {

           alias /usr/local/nginxV3R6/nginx/html/ai-adapter-robot-mobile/dist/;
            index index.html index.htm; # 默认⾸⻚

        }
        location /api/npcsapp {
            proxy_pass   http://10.16.23.199:8082/npcsapp/;
            proxy_redirect off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
           proxy_cookie_path  /npcsapp /api/npcsapp;
        }
    
 location  /npcs/app/ {
            proxy_pass   http://10.16.23.199:8082/npcsapp/npcs/app/;
            proxy_redirect off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

        }

 location ^~ /npcs {
            proxy_pass   http://10.16.23.199:8082;
            proxy_redirect off;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

        }
 location ^~ /dmp-allin/ {
	       proxy_buffering off;
    # 禁止压缩（压缩会缓存数据，打断流式输出）
       		 gzip off;
    #         # 强制立即刷新缓冲区
            proxy_max_temp_file_size 0;
            proxy_pass   http://10.16.22.52:9862/dmp-allin/;
            proxy_redirect off;
add_header 'Access-Control-Allow-Origin' '*';        
    proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
	    proxy_set_header Origin 'http://10.16.22.52:9862';
	      proxy_set_header Cookie $http_cookie;
#	proxy_set_header Jsessionid $http_jsessionid;
       #	proxy_set_header  X-Aa-Token 'eyJhbGciOiJIUzI1NiJ9.eyJUVCI6IlUiLCJVVCI6IjJiZTk4YWZjODZhYTdmMmU0Y2I3OWNlNzFkYTlmYTZkNCJ9.Ww5b4Nw6DG8lIH_iGvwKnMqFe45q39ciXvzlHX4AGwU';	
        }  
    }
